<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Ícone usado quando se adiciona a TuCAN! ao ecrã inicial do telemóvel
         (iOS Safari) — gerado por scripts/make_home_icons.py a partir do
         mascote ToucanAvatar. Caminho relativo para funcionar tanto em
         localhost como sob /TuCan/ no GitHub Pages. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Manifest para o "instalar app" do Chrome/Android usar o mesmo ícone. -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#121417" />
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
